<div class="review-item" style="border:1px solid #D4D9E2;border-radius:8px;overflow:hidden;margin:16px 0;">
  <div style="background:#6b46c1;color:white;padding:12px 20px;">
    <h2 style="margin:0;font-size:18px;">{{TITLE}}</h2>
    <span style="font-size:12px;opacity:0.8;">Posted {{DATE}}</span>
  </div>
  <div style="padding:20px;">
    <p style="margin:0 0 12px;">{{DESCRIPTION}}</p>
    <a href="{{URL}}" target="_blank" style="color:#2E5295;font-weight:600;font-size:14px;">{{URL}}</a>
    <div style="background:#F5F7FA;border-radius:6px;padding:12px;margin-top:16px;">
      <strong>What to check:</strong>
      <ul style="margin:8px 0 0;padding-left:20px;">
        {{CHECKLIST_ITEMS}}
      </ul>
    </div>
  </div>
</div>
